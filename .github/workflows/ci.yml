name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: audit_owner
          POSTGRES_PASSWORD: owner-pass
          POSTGRES_DB: audit_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U audit_owner -d audit_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Secret scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply migrations
        run: |
          sudo apt-get install -y postgresql-client
          for f in migrations/*.sql; do
            echo "Applying $f"
            PGPASSWORD=owner-pass psql -h localhost -p 5434 -U audit_owner -d audit_test -f "$f"
          done

      - name: Run tests
        run: npm test
