services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: audit_owner
      POSTGRES_PASSWORD: owner-pass
      POSTGRES_DB: audit
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro

  test-db:
    image: postgres:16
    environment:
      POSTGRES_USER: audit_owner
      POSTGRES_PASSWORD: owner-pass
      POSTGRES_DB: audit_test
    ports:
      - "5434:5432"
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d:ro

volumes:
  pgdata: