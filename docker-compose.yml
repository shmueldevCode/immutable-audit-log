services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: audit_owner
      POSTGRES_PASSWORD: owner-pass
      POSTGRES_DB: audit
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit_owner -d audit"]
      interval: 2s
      timeout: 3s
      retries: 10

  test-db:
    image: postgres:16
    environment:
      POSTGRES_USER: audit_owner
      POSTGRES_PASSWORD: owner-pass
      POSTGRES_DB: audit_test
    ports:
      - "5434:5432"
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d:ro

  app:
    build: .
    environment:
      DATABASE_URL: postgres://audit_app:app-pass@db:5432/audit
      API_KEY: 746a5a8a32e2fd39e8890cb7c89feacbec70ca0c759fd0d3d519694f68811811
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
